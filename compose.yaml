name: concert-booking

services:
  postgres:
    image: postgres:16
    container_name: concert-booking-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-concert_dev}
      POSTGRES_DB: ${POSTGRES_DB:-concert_booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an ignored .env file or environment}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
    name: concert-booking-pgdata
